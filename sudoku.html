<!DOCTYPE html>
<head>
	<title>SUDOKU</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
</head>
<body>
<script>
var canvas = document.createElement("CANVAS");
document.body.appendChild(canvas);
canvas.style.display = "block";
var ctx = canvas.getContext("2d");
document.body.style.margin = 0;
document.body.style.overflow = "none";

var settings = {
	bg: "#fff",
	outlines: "#555",
	lines: "#999",
	numbers: "#555",
	guesses: "#79e",
	notes: "#79e",
	textSize : 1,
	invalid: "#ff3",
	invalidBackground: "#e32",
	buttons: "#999",
	selected: "#79e",
	selectedBackground: "#ff3",
};

var sudoku = [];
var selected = 9;
var type = 0;
var mode = 0; // 1 is notes

var frame = 0;
function update() {
	frame++;
	resize();
	
	setDimensions();
	
	render();
	
	renderTools();
	
	requestAnimationFrame(update);
}

function save() {
	localStorage.sudoku = JSON.stringify(sudoku);
}

function load() {
	if (localStorage.sudoku) {
		sudoku = JSON.parse(localStorage.sudoku);
	}
}

window.onload = function(event) {
	load();
	update();
}

window.onresize = function(event) {
	resize();
}

canvas.addEventListener("touchstart", function(event) {
	event.preventDefault();
	
	const touches = event.changedTouches; // A TouchList of all touch points that changed

    for (let i = 0; i < touches.length; i++) {
		const touch = touches[i];
		handleTouch(touch);
	}
});

canvas.onmousedown = function(event) {
	handleTouch(event);
}

document.onkeydown = function(event) {
	var asdf = event.keyCode - 48;
	if (asdf > 0 && asdf < 10) {
		selected = asdf;
	} else if (event.keyCode === 13) {
		if (type) {
			solve();
		}
		type = 1;
	} else if (asdf === 0) {
		selected = 0;
	} else if (event.keyCode === 16) {
		mode = 1;
	}
}

document.onkeyup = function(event) {
	if (event.keyCode === 16) {
		mode = 0;
	}
}

function handleTouch(touch) {
	if (touch.clientX < x || touch.clientX > x + width || touch.clientY < y || touch.clientY > y + width) {
		// not inside the sudoku
		if (onBottom) {
			if (touch.clientX > x && touch.clientX < x + width && touch.clientY >= y + width + toolsMargin && touch.clientY <= y + width + toolsMargin + scale) {
				selected = 1 + Math.max(0, Math.min(8, Math.floor(touch.clientX / scale) ) );
			} else if (touch.clientX > buttons.notes.x && touch.clientX < buttons.notes.x + buttonWidth && touch.clientY >= buttons.notes.y && touch.clientY <= buttons.notes.y + scale) {
				mode = 1 - mode;
			}
		} else {
			
		}
		return;
	}
	var square = Math.floor((touch.clientY-y)/scale)*9 + Math.floor((touch.clientX-x)/scale);
	console.log(square);
	if (mode) {
		if (sudoku[square] && sudoku[square].notes) {
			if (sudoku[square].notes.includes(selected)) {
				sudoku[square].notes.splice(sudoku[square].notes.indexOf(selected), 1);
			} else {
				sudoku[square].notes.push(selected);
			}
		} else {
			sudoku[square] = {n: 0, type: 0, notes: [selected]};
		}
	} else {
		sudoku[square] = {n: selected, type: type};
	}
	save();
}

function checkInvalid(row, col, number) { // this method is probably too slow
	for (var i = 0; i < 9; i++) {
		var square = row*9 + i;
		if (i === col) continue;
		if (sudoku[square] && sudoku[square].n === number) {
			return true;
		}
	}
	for (var i = 0; i < 9; i++) {
		var square = i*9 + col;
		if (i === row) continue;
		if (sudoku[square] && sudoku[square].n === number) {
			return true;
		}
	}
	for (var i = 0; i < 9; i++) {
		var square = Math.floor(row/3)*3*9 + Math.floor(i/3)*9 + Math.floor(col/3)*3 + i%3;
		if (square === row*9 + col) continue;
		if (sudoku[square] && sudoku[square].n === number) {
			return true;
		}
	}
	return false;
}

var scale;
var width;
var x;
var y;
var fontWidth;
var fontHeight;
var fontCalX;
var fontCalY;
var noteHeight;

var onBottom;
var toolsMargin = 10;

var buttonText;
var buttonXPadding;
var buttonWidth;
var buttons = {
	notes: {}
};

function resize() {
	canvas.width = Math.floor(window.innerWidth);
	canvas.height = Math.floor(window.innerHeight);
	onBottom = canvas.height >= canvas.width;
	onBottom = true; // yeeeet
	/*
	var dpr = window.devicePixelRatio || 1;
	canvas.width = Math.floor(window.innerWidth * dpr);
	canvas.height = Math.floor(window.innerHeight * dpr);
	canvas.style.width = `${Math.floor(window.innerWidth)}px`;
	canvas.style.height = `${Math.floor(window.innerHeight)}px`;
	ctx.scale(dpr, dpr);
	*/
}

function setDimensions() {
	scale = Math.floor(Math.min(canvas.width, canvas.height)/9);
	width = 9*scale;
	x = Math.floor((canvas.width - width)/2);
	y = Math.floor((canvas.height - width)/2);
	if (canvas.height >= canvas.width) {
		y -= scale;
	}
	
	fontHeight = Math.floor(54 * scale/64);
	fontCalX = Math.floor(28 * scale/64);
	fontCalY = Math.floor(18 * scale/64);
	
	noteHeight = Math.floor(fontHeight / 3);
	noteCalX = Math.floor(fontCalX / 3);
	noteCalY = Math.floor(fontCalY / 3);
	
	ctx.font = fontHeight + "px Monospace";
	buttonText = "notes";
	buttonXPadding = Math.floor(scale / 4);
	buttonWidth = ctx.measureText(buttonText).width + buttonXPadding*2;
	
	buttons.notes.x = x + (canvas.width - buttonWidth)/2;
	buttons.notes.y = y + width + 2*toolsMargin + scale;
}

function render() {
	for (var i = 0; i < 10; i++) {
		var thickness = (i%3 === 0) + 1;
		ctx.fillStyle = i%3===0 ? settings.outlines : settings.lines;
		ctx.fillRect(x + i*scale - thickness + 1, y, thickness, width);
	}
	for (var i = 0; i < 10; i++) {
		var thickness = (i%3 === 0) + 1;
		ctx.fillStyle = i%3===0 ? settings.outlines : settings.lines;
		ctx.fillRect(x, y + i*scale - thickness + 1, width, thickness);
	}
	
	var solved = isSolved();

	for (var i = 0; i < 9; i++) {
		for (var j = 0; j < 9; j++) {
			var asdf = 9*i + j;
			if (sudoku[asdf] && sudoku[asdf].n) {
				if (sudoku[asdf].type === 0) {
					ctx.fillStyle = settings.numbers;
				} else {
					ctx.fillStyle = settings.guesses;
				}
				if (checkInvalid(i, j, sudoku[asdf].n)) {
					ctx.fillStyle = settings.invalidBackground;
					ctx.fillRect(x + j * scale + 1, y + i * scale + 1, scale - 1, scale - 1);
					ctx.fillStyle = settings.invalid;
				}
				ctx.font = fontHeight + "px Monospace";
				if (solved) {
					ctx.fillStyle = `hsl(${(i + j) * 20 + frame}, 80%, 50%)`;
				}
				ctx.fillText(String(sudoku[asdf].n), x + j * scale + Math.floor((scale - fontCalX)/2), y + i * scale + Math.floor((scale + fontHeight - fontCalY)/2));
			} else if (sudoku[asdf]) {
				if (sudoku[asdf].notes) {
					for (k = 0; k < sudoku[asdf].notes.length; k++ ) {
						var number = sudoku[asdf].notes[k];
						ctx.fillStyle = settings.notes;
						
						if (checkInvalid(i, j, sudoku[asdf].notes[k])) {
							ctx.fillStyle = settings.invalidBackground;
							ctx.fillRect(x + j * scale + 1 + Math.floor(scale/3 * ((number-1)%3)), y + i * scale + 1 + Math.floor(scale/3 * ((Math.floor((number-1)/3))%3)), Math.floor(scale/3) - 1, Math.floor(scale/3) - 1);
							ctx.fillStyle = settings.invalid;
						}
						ctx.font = noteHeight + "px Monospace";
						ctx.fillText(String(number), x + j * scale + Math.floor((scale - noteCalX)/2) + Math.floor(scale/3 * ((number-1)%3 - 1)), y + i * scale + Math.floor((scale + noteHeight - noteCalY)/2) + Math.floor(scale/3 * ((Math.floor((number-1)/3))%3 - 1)));
					}
				}
			}
		}
	}
}

function renderTools() {
	if (onBottom) {
		for (var i = 0; i < 10; i++) {
			var thickness = (i%3 === 0) + 1;
			ctx.fillStyle = i%3===0 ? settings.outlines : settings.lines;
			ctx.fillRect(x + i*scale - thickness + 1, y + width + toolsMargin, thickness, scale);
		}
		for (var i = 0; i < 2; i++) {
			var thickness = (i%3 === 0) + 1;
			ctx.fillStyle = i%3===0 ? settings.outlines : settings.lines;
			ctx.fillRect(x, y + i*scale - thickness + 1 + width + toolsMargin, width, thickness);
		}
	}
	ctx.font = fontHeight + "px Monospace";
	for (var j = 0; j < 9; j++) {
		ctx.fillStyle = settings.buttons;
		if (selected === j + 1) {
			ctx.fillStyle = settings.selectedBackground;
			ctx.fillRect(x + j * scale + 1, y + 1 + width + toolsMargin, scale - 1, scale - 1);
			ctx.fillStyle = settings.selected;
		}
		ctx.fillText(String(j + 1), x + j * scale + Math.floor((scale - fontCalX)/2), y + Math.floor((scale + fontHeight - fontCalY)/2) + width + toolsMargin);
	}
	
	ctx.lineWidth = 2;
	ctx.strokeStyle = settings.lines;
	ctx.fillStyle = settings.buttons;
	if (mode) {
		ctx.fillStyle = settings.selectedBackground;
		ctx.fillRect(x + Math.floor(canvas.width - buttonWidth)/2- 2, y + width + 2*toolsMargin + scale, buttonWidth, scale);
		ctx.fillStyle = settings.selected;
	}
	ctx.strokeRect(buttons.notes.x, buttons.notes.y, buttonWidth, scale);
	ctx.strokeStyle = settings.buttons;
	ctx.fillText(buttonText, buttons.notes.x + buttonXPadding, buttons.notes.y + + Math.floor((scale + fontHeight - fontCalY)/2));
}

function note() {
	for (var i = 0; i < 81; i++) {
		// for each square check if the number is valid in it
		for (var n = 1; n < 10; n++) {
			// create if it doesn't exist
			if (!sudoku[i]) {
				sudoku[i] = {n: 0, type: 0, notes: []};
			}
			if (!sudoku[i].notes) {
				sudoku[i].notes = [];
			}
			if (!checkInvalid(Math.floor(i/9), i%9, n)) {
				// add the number as a note
				if (!sudoku[i].notes.includes(n)) {
					sudoku[i].notes.push(n);
				}
			} else {
				// otherwise remove it because it can't go there
				if (sudoku[i].notes.includes(n)) {
					sudoku[i].notes.splice(sudoku[i].notes.indexOf(n), 1);
				}
			}
		}
	}
}

function solve() {
	// first note everything
	note();
	// look in each box, row, column to check if there is only one place something can go
	for (var n = 1; n < 10; n++) {
		
	}

	
	// if something has changed, call solve again
	
}

function isSolved() { // actually just returns if the board is full
	for (var i = 0; i < 81; i++) {
		if (!(sudoku[i] && sudoku[i].n && sudoku[i].n !== 0)) {
			return false;
		}
		if (checkInvalid(Math.floor(i/9), i%9, sudoku[i].n)) {
			return false;
		}
	}
	return true;
}

</script>
</body>
